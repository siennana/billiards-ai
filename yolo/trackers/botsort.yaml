# Custom BoT-SORT config tuned for billiards: extended track_buffer keeps
# Kalman-coasting tracks alive through long occlusions (cue, hands, players)
# so re-detections reuse the original track ID instead of minting a new one.
# new_track_thresh raised slightly to suppress spurious one-frame tracks.
tracker_type: botsort

# Conf threshold for the first matching pass — only detections >= this are
# matched to existing tracks on attempt 1.
track_high_thresh: 0.6

# Second-pass threshold — lower-conf detections >= this are then matched to
# any tracks still unmatched after pass 1. Helps preserve IDs through brief
# low-conf moments (motion blur, partial occlusion).
track_low_thresh:  0.35

# Min conf to spawn a brand-new track from an unmatched detection. Higher
# = fewer spurious one-frame tracks but slower to pick up real new balls.
new_track_thresh:  0.6

# Frames a lost track is kept alive on Kalman predictions before being
# deleted. ~3 sec at 30fps. Raise to bridge longer occlusions.
track_buffer:      150

# Max matching cost (1 - IoU, optionally fused with conf). Higher = looser
# IoU matching. 0.85 ≈ accepts matches down to IoU ~0.15.
match_thresh:      0.85

# When True, blends detection conf into the IoU cost so high-conf
# detections are preferred during ambiguous assignments.
fuse_score:        True

# Global motion compensation method — corrects track predictions for
# camera motion. sparseOptFlow uses Lucas–Kanade on sparse features.
# (Static-camera billiards barely needs it but it's cheap.)
gmc_method:        none

# Spatial gate for ReID matching: candidate must be within this IoU
# distance of the predicted track before appearance is considered.
proximity_thresh:  0.5

# Appearance-similarity threshold for ReID matching (cosine distance on
# embeddings). Lower = stricter visual match required.
appearance_thresh: 0.25

# Enable appearance-based re-identification using a separate embedding
# model. Off here — billiard balls are visually too similar (solid colors)
# for a generic ReID model to add value, and it adds inference cost.
with_reid:         False
